<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV Bullshitter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>CV Bullshitter</h1>
    <p class="tag">Paste a job description. Get the perfect CV.</p>

    <form id="form">
      <div class="grid">
        <label>Name<input name="name" required></label>
        <label>Phone<input name="phone"></label>
        <label>Email<input name="email" type="email"></label>
        <label>Location<input name="location" placeholder="City, Country"></label>
        <label>Latest company<input name="company" required></label>
        <label>Company country<input name="companyCountry" placeholder="e.g. Germany"></label>
        <label>Years at company<input name="companyYears" type="number" min="0.5" max="40" step="0.5" placeholder="e.g. 3"></label>
        <label>Jobs in CV (incl. latest)
          <select name="jobCount">
            <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
          </select>
        </label>
        <label class="wide">Education <span class="opt">(optional — blank = AI invents)</span><input name="education" placeholder="BSc Computer Science, University of Manchester, 2013–2017"></label>
        <label class="wide">Languages <span class="opt">(optional — blank = AI invents)</span><input name="languages" placeholder="English native, French B2"></label>
      </div>
      <label>Job description<textarea name="jobDescription" rows="12" required placeholder="Paste the full job description here…"></textarea></label>
      <button id="start" type="submit">Start</button>
      <p id="status"></p>
    </form>

    <section id="result" hidden>
      <div class="bar">
        <h2>Preview</h2>
        <button id="download" type="button">Download PDF</button>
      </div>
      <iframe id="preview" title="CV preview"></iframe>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
